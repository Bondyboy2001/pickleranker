# Cloudflare Pages configuration for Pickleball Leaderboard
# This project uses Next.js static export (output: 'export')

name = "pickleranker"
compatibility_date = "2024-01-01"

# Pages configuration
[pages]
# Build output directory (matches Next.js static export)
output_directory = "out"

# Build command
[build.command]
command = "npm run build"

# Environment variables (optional - can also be set in dashboard)
# [vars]
# NEXT_PUBLIC_SUPABASE_URL = ""
# NEXT_PUBLIC_SUPABASE_ANON_KEY = ""
# NEXT_PUBLIC_SITE_URL = "https://dlpickle.pages.dev"
